description: >-
  Loris was an AI-powered customer service and conversation intelligence
  platform that analyzed voice, chat, and email interactions to surface contact
  drivers, sentiment shifts, and quality signals for support teams. Originally a
  Techstars-backed startup, Loris was acquired by Contentsquare and its product
  has been folded into the Contentsquare Conversation Intelligence offering. The
  standalone loris.ai property now 301-redirects to contentsquare.com and the
  company no longer publishes an independent public developer API, developer
  portal, or API documentation surface. This profile is retained in the API
  Evangelist network as an acquired-company record.
